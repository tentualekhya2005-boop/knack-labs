name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Run Migrations & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upsk_sdf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d upsk_sdf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/upsk_sdf
      REDIS_URL: redis://localhost:6379/0
      PORT: 8000
      JWT_SECRET: ci-test-secret-key-32-chars-long-1234
      ENVIRONMENT: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Database Migrations
        working-directory: apps/api
        run: |
          alembic upgrade head

      - name: Run Integration & Unit Test Suite
        working-directory: apps/api
        run: |
          python -m pytest -v

      - name: Validate Container Build
        working-directory: apps/api
        run: |
          docker build -t link-shortener-api:latest .

